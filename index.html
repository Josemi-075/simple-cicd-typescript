
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TypeScript Calculator</title>
</head>
<body>

  <h1>Calculator</h1>

  <input type="number" id="numberA" placeholder="First number">
  <input type="number" id="numberB" placeholder="Second number">

  <br><br>

  <label for="operation">Choose an operation:</label>

  <select id="operation">
    <option value="sum">+</option>
    <option value="subtract">−</option>
    <option value="multiply">×</option>
    <option value="divide">÷</option>
  </select>

  <button id="calculate">Calculate</button>

  <h2>Result:</h2>
  <p id="result">---</p>

  <script src="sum.js"></script>

  <script>
    const numberA = document.getElementById("numberA");
    const numberB = document.getElementById("numberB");
    const operation = document.getElementById("operation");
    const calculateButton = document.getElementById("calculate");
    const result = document.getElementById("result");

    calculateButton.addEventListener("click", () => {
      const a = Number(numberA.value);
      const b = Number(numberB.value);

      try {
        let calculationResult;

        switch (operation.value) {
          case "sum":
            calculationResult = window.sum(a, b);
            break;

          case "subtract":
            calculationResult = window.subtract(a, b);
            break;

          case "multiply":
            calculationResult = window.multiply(a, b);
            break;

          case "divide":
            calculationResult = window.divide(a, b);
            break;
        }

        result.textContent = String(calculationResult);
      } catch (error) {
        result.textContent = error.message;
      }
    });
  </script>

</body>
</html>
